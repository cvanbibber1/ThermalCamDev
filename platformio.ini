[platformio]
default_envs = target

[env:target]
platform = ststm32@19.6.0
board = genericSTM32F412CG
framework = stm32cube
board_build.stm32cube.custom_config_header = yes
; The development COBS transport is replaced by the STP flight link on this
; branch; both would claim the USART2 callbacks.
build_src_filter = +<*> -<drivers/rs485.c>
build_flags =
  -D HSE_VALUE=8000000U
  -D USE_HAL_DRIVER
  -D STM32F412Cx
  -I include
debug_tool = custom
upload_protocol = custom

[env:native]
platform = native
test_build_src = yes
build_flags =
  -std=c11
  -I include
build_src_filter =
  +<protocol/**>
  +<lepton/vospi_parser.c>
  +<health.c>
  -<protocol/command_dispatch.c>
  -<main.c>
  -<board/**>
  -<drivers/**>
  -<lepton/lepton_cci.c>
  -<lepton/lepton_capture.c>
  -<usb/**>
