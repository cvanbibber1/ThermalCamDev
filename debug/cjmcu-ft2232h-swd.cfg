adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0

# ADBUS0=TCK/SWCLK, ADBUS1=TDI/SWDIO output through 470R,
# ADBUS2=TDO/SWDIO input, ADBUS4=active-low NRST.
ftdi layout_init 0x0000 0x000b
ftdi layout_signal nSRST -data 0x0010 -oe 0x0010
ftdi layout_signal SWD_EN -data 0
ftdi layout_signal SWDIO_OE -data 0

transport select swd
adapter speed 1000
reset_config srst_only srst_nogate
